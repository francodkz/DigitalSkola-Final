name: Deploy to GCP Cloud Run

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: gcp-project-id-kamu        # Nanti diganti dengan Project ID GCP kamu
  REGION: asia-southeast2                # Region Jakartaa
  SERVICE_NAME: wibe-studio-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker to use GCP Registry
      run: gcloud auth configure-docker asia-southeast2-docker.pkg.dev --quiet

    - name: Build and Push Docker Image
      run: |
        IMAGE_URL="asia-southeast2-docker.pkg.dev/$PROJECT_ID/cloud-run-source-repo/$SERVICE_NAME:${{ github.sha }}"
        docker build -t $IMAGE_URL .
        docker push $IMAGE_URL
        echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: ${{ env.SERVICE_NAME }}
        image: ${{ env.IMAGE_URL }}
        region: ${{ env.REGION }}
        flags: '--allow-unauthenticated --port=80'
